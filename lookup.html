        function searchWork() {
            const input = document.getElementById('trackInput').value.toLowerCase();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';
            let found = false;

            for (const composer in db) {
                for (const work in db[composer]) {
                    if (work.toLowerCase().includes(input)) {
                        let html = `<strong>${composer}</strong><br><em>${work}</em><ul>`;
                        for (const mv of db[composer][work]) {
                            html += `<li>${mv.movement} &mdash; ${mv.time_signature}</li>`;
                        }
                        html += '</ul>';
                        resultDiv.innerHTML = html;
                        found = true;
                        break;
                    }
                }
                if (found) break;
            }
            if (!found) resultDiv.innerHTML = 'No match found in dataset.';
        }

        document.getElementById('dataset').textContent = JSON.stringify(db, null, 2);
    </script>
